<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa RIGI por provincia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css">
<style>
  :root{
    --text-primary:#1a1a19; --text-secondary:#52514e; --text-muted:#898781; --text-accent:#185FA5;
    --surface-1:#F0EFEA; --surface-2:#ffffff; --border:#d8d7d0; --border-strong:#b4b2a9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--text-primary);background:transparent;padding:8px;}
  .wrap{max-width:640px;margin:0 auto;}
  h3{font-size:15px;margin:0 0 10px;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px;font-size:12px;color:var(--text-secondary);}
  .legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:5px;}
  button{border:0.5px solid var(--border-strong);border-radius:8px;cursor:pointer;color:var(--text-primary);font-family:inherit;}
  #tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:10px;padding:0;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,0.14);width:244px;z-index:20;overflow:hidden;}
  .foot{margin-top:8px;font-size:11px;color:var(--text-muted);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h3>Dónde se concentran las inversiones del RIGI</h3>
  <div class="legend">
    <span><span class="sw" style="background:#185FA5;"></span>Con proyectos RIGI</span>
    <span><span class="dot" style="background:#1D9E75;"></span>Aprobado</span>
    <span><span class="dot" style="background:#EF9F27;"></span>En evaluación</span>
    <span id="hint" style="margin-left:auto;color:var(--text-muted);">Clic en una provincia para hacer zoom</span>
  </div>
  <div style="position:relative;">
    <div id="argmap" style="width:100%;"></div>
    <button id="backbtn" style="position:absolute;top:10px;left:10px;z-index:8;font-size:12px;padding:6px 12px;display:none;align-items:center;gap:5px;background:var(--surface-2);"><i class="ti ti-arrow-left"></i> Volver al país</button>
    <div id="tip"></div>
  </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(function(){
const fmt = n => (typeof n!=='number') ? n : (n>=1000 ? '$'+(n/1000).toFixed(1).replace(/\.0$/,'')+' MM' : '$'+n+' M');
const sIcon = { petroleo:'ti-flame', gnl:'ti-air-conditioning', litio:'ti-battery-3', cobre:'ti-diamond', oro:'ti-coin', infra:'ti-anchor', sider:'ti-building-factory-2', renov:'ti-wind-turbine', fert:'ti-plant-2' };
const sName = { petroleo:'Petróleo y gas', gnl:'GNL', litio:'Litio', cobre:'Cobre', oro:'Oro y plata', infra:'Infraestructura', sider:'Siderurgia', renov:'Renovables', fert:'Fertilizantes' };

// Totales por provincia (aprobados), montos en millones de u$s y empleos directos+indirectos prometidos
const provData = {
  'Neuquén':{inv:5822,ap:2,ev:5,jobs:4222}, 'Río Negro':{inv:8178,ap:3,ev:2,jobs:4780},
  'San Juan':{inv:13510,ap:4,ev:1,jobs:44600}, 'Catamarca':{inv:2844,ap:5,ev:1,jobs:10600},
  'Salta':{inv:4055,ap:3,ev:1,jobs:6333}, 'Jujuy':{inv:1166,ap:1,ev:1,jobs:800},
  'Mendoza':{inv:1102,ap:2,ev:0,jobs:2784}, 'Buenos Aires':{inv:562,ap:2,ev:3,jobs:3965},
  'Santa Fe':{inv:277,ap:1,ev:1,jobs:9700}, 'La Pampa':{inv:550,ap:1,ev:0,jobs:7535}
};

const projects = [
  {p:'Neuquén', n:'Rincón de Aranda (Pampa Energía)', loc:'Añelo', s:'petroleo', st:'aprobado', inv:4522, j:1800, ll:[-38.35,-68.79], approx:false, d:'Shale oil, la mayor inversión de desarrollo de Pampa. Exporta u$s17.000 M en 30 años. 800 directos y 1.000 indirectos, casi todos de obra. Opera 2027.'},
  {p:'Neuquén', n:'Vaca Muerta Oil Sur (VMOS)', loc:'Añelo → Punta Colorada', s:'petroleo', st:'aprobado', inv:1300, j:3108, ll:[-38.5,-68.4], approx:true, d:'Oleoducto de 437 km, Allen–Punta Colorada. Consorcio de 8 petroleras liderado por YPF. Opera fines de 2026. Punto sobre traza.'},
  {p:'Neuquén', n:'Compañía MEGA (ampliación)', loc:'Loma La Lata', s:'petroleo', st:'evaluación', inv:360, j:800, ll:[-38.6,-68.9], approx:true, d:'Ampliación de producción de líquidos de gas natural. u$s190 M anuales en exportaciones. Aprobado por el Comité, resolución pendiente.'},
  {p:'Río Negro', n:'GNL PAE–Golar (Southern Energy)', loc:'Punta Colorada, Sierra Grande', s:'gnl', st:'aprobado', inv:6878, j:836, ll:[-41.6,-65.35], approx:false, d:'Licuefacción de gas en el golfo de San Matías. Opera desde 2027. Muy poco empleo permanente pese a ser el mayor proyecto en monto tras Vicuña.'},
  {p:'Río Negro', n:'San Matías Pipeline', loc:'Vaca Muerta → golfo San Matías', s:'petroleo', st:'aprobado', inv:1300, j:'—', ll:[-40.5,-66.2], approx:true, d:'Transporte de gas para exportación de GNL. Punto sobre traza.'},
  {p:'Río Negro', n:'VMOS (tramo Río Negro)', loc:'Allen–Chelforó', s:'petroleo', st:'aprobado', inv:'—', j:3944, ll:[-39.0,-66.6], approx:true, d:'Tramo rionegrino del oleoducto y terminal de Punta Colorada.'},
  {p:'San Juan', n:'Vicuña (Josemaría + Filo del Sol)', loc:'Calingasta', s:'cobre', st:'aprobado', inv:9700, j:31700, ll:[-29.1,-69.7], approx:false, d:'La mayor inversión de la historia de la minería argentina (BHP + Lundin). Cobre, oro y plata. u$s2.600 M de exportación anual. Empleo mayormente de construcción.'},
  {p:'San Juan', n:'Los Azules', loc:'Calingasta', s:'cobre', st:'aprobado', inv:2672, j:7391, ll:[-31.11,-70.22], approx:false, d:'Cobre a 3.600 msnm (McEwen). El mayor impacto laboral entre los mineros. Pre-construcción, opera enero 2029.'},
  {p:'San Juan', n:'Carbonatos Profundos (Gualcamayo)', loc:'Jáchal', s:'oro', st:'aprobado', inv:665, j:4500, ll:[-29.98,-68.78], approx:false, d:'Oro en Quebrada del Diablo, Jáchal. Alto impacto en empleo directo. Operación plena hacia 2031.'},
  {p:'San Juan', n:'Veladero (ampliación fases 8 y 9)', loc:'Iglesia', s:'oro', st:'aprobado', inv:436, j:1048, ll:[-29.35,-69.95], approx:false, d:'Ampliación del sistema de lixiviación de la mina de oro y plata (Barrick + Shandong). En construcción, opera dic-2026.'},
  {p:'Catamarca', n:'Salar Tres Quebradas (LIEX)', loc:'Fiambalá', s:'litio', st:'aprobado', inv:709, j:4400, ll:[-27.15,-68.5], approx:false, d:'Litio, 40.000 t/año de carbonato. Aprobado en la última tanda. Resolución pendiente de publicación.'},
  {p:'Catamarca', n:'Fénix Expansión 1B (Rio Tinto)', loc:'Salar del Hombre Muerto', s:'litio', st:'aprobado', inv:531, j:1143, ll:[-25.4,-67.0], approx:false, d:'Litio. 1.143 puestos en construcción pero solo 504 en operación: el patrón extractivo en estado puro.'},
  {p:'Catamarca', n:'Hombre Muerto Oeste (Galan)', loc:'Salar del Hombre Muerto', s:'litio', st:'aprobado', inv:292, j:'—', ll:[-25.5,-67.05], approx:false, d:'Cloruro de litio, u$s180 M anuales de exportación desde 2029 (Galan Lithium).'},
  {p:'Catamarca', n:'Liex (sucursal dedicada)', loc:'Fiambalá', s:'litio', st:'aprobado', inv:710, j:'—', ll:[-27.2,-68.55], approx:true, d:'Estructura dedicada del proyecto de litio de Zijin/LIEX.'},
  {p:'Salta', n:'Diablillos (AbraSilver)', loc:'límite Salta–Catamarca', s:'oro', st:'aprobado', inv:764, j:1200, ll:[-25.68,-66.9], approx:false, d:'Mina biprovincial de oro y plata en la Puna. Busca crear 1.200 empleos directos.'},
  {p:'Salta', n:'Proyecto Rincón (Rio Tinto)', loc:'Salar de Rincón', s:'litio', st:'aprobado', inv:2744, j:'—', ll:[-24.0,-66.95], approx:false, d:'Litio. Primer envío comercial ya realizado a Shanghái. Única productora con exportación activa en el NOA.'},
  {p:'Salta', n:'Sal de Oro II (POSCO)', loc:'Salar del Hombre Muerto', s:'litio', st:'aprobado', inv:547, j:'—', ll:[-25.3,-66.95], approx:false, d:'2ª etapa (POSCO). 23.000 t/año de carbonato de litio. Bajo empleo permanente.'},
  {p:'Jujuy', n:'Cauchari-Olaroz (ampliación)', loc:'Susques', s:'litio', st:'aprobado', inv:1166, j:800, ll:[-23.6,-66.7], approx:false, d:'Litio (Ganfeng/Lithium Americas/JEMSE), Susques. De 40.000 a 85.000 t/año. Opera dic-2028.'},
  {p:'Mendoza', n:'PSJ Cobre Mendocino (San Jorge)', loc:'Uspallata, Las Heras', s:'cobre', st:'aprobado', inv:891, j:2400, ll:[-32.24,-69.44], approx:false, d:'Primer gran proyecto de cobre de Mendoza. Incluye parque solar de 300 MW. Opera 2029.'},
  {p:'Mendoza', n:'Parque solar El Quemado', loc:'Las Heras', s:'renov', st:'aprobado', inv:211, j:384, ll:[-32.6,-68.35], approx:false, d:'Parque solar de YPF Luz. Primer proyecto RIGI inaugurado (genera desde dic-2025).'},
  {p:'Buenos Aires', n:'Sidersa', loc:'San Nicolás', s:'sider', st:'aprobado', inv:286, j:3800, ll:[-33.33,-60.22], approx:false, d:'Planta siderúrgica en San Nicolás. Excepción industrial: mucho más encadenamiento local que los extractivos.'},
  {p:'Buenos Aires', n:'Parque eólico Olavarría', loc:'Olavarría', s:'renov', st:'aprobado', inv:276, j:165, ll:[-36.9,-60.32], approx:false, d:'Energías renovables.'},
  {p:'Buenos Aires', n:'Planta de fertilizantes (Pampa)', loc:'Bahía Blanca', s:'fert', st:'evaluación', inv:2700, j:3500, ll:[-38.72,-62.27], approx:true, d:'Nueva planta de fertilizantes de Pampa Energía. u$s800 M anuales en divisas. Aprobada por el Comité, resolución pendiente.'},
  {p:'Santa Fe', n:'Terminal Timbúes', loc:'Timbúes', s:'infra', st:'aprobado', inv:277, j:9700, ll:[-32.67,-60.7], approx:false, d:'Puerto multipropósito sobre el Paraná. El proyecto que MÁS empleo promete con la MENOR inversión relativa: la contracara exacta del enclave.'},
  {p:'La Pampa', n:'Ampliación Gasoducto Perito Moreno', loc:'Tramo I', s:'petroleo', st:'aprobado', inv:550, j:7535, ll:[-36.6,-64.3], approx:true, d:'TGS. Refuerza el transporte de gas hacia Buenos Aires. Segundo mayor generador de empleo del RIGI. Punto sobre traza.'}
];

const ramp = ['#B5D4F4','#378ADD','#185FA5','#0C447C'];
const color = d3.scaleThreshold().domain([1000,4000,9000]).range(ramp);
const tip=document.getElementById('tip'), back=document.getElementById('backbtn'), hint=document.getElementById('hint');
const W=560,H=760;
function row(k,v,b){return '<div style="display:flex;justify-content:space-between;gap:12px;margin:2px 0;"><span style="color:var(--text-secondary);">'+k+'</span><span style="color:var(--text-primary);'+(b?'font-weight:500;':'')+'">'+v+'</span></div>';}

d3.json('https://cdn.jsdelivr.net/npm/datamaps@0.5.10/src/js/data/arg.topo.json').then(function(topo){
  const key=Object.keys(topo.objects)[0];
  const fc=topojson.feature(topo,topo.objects[key]);
  const feats=fc.features;
  const projection=d3.geoMercator().fitSize([W,H],fc);
  const path=d3.geoPath(projection);
  const svg=d3.select('#argmap').append('svg').attr('viewBox','0 0 '+W+' '+H).attr('width','100%').style('max-height','640px').style('display','block').style('margin','0 auto');
  const g=svg.append('g');
  const pname=d=>d.properties.name||d.properties.NAME_1||d.properties.provincia||'';
  let zoomed=false;

  const provPaths=g.selectAll('path.prov').data(feats).join('path').attr('class','prov')
    .attr('d',path).attr('stroke','#fff').attr('stroke-width',0.6)
    .attr('fill',d=>{const r=provData[pname(d)];return r?color(r.inv):'#E1E0D9';})
    .style('cursor',d=>provData[pname(d)]?'pointer':'default')
    .on('mousemove',function(ev,d){
      if(zoomed) return;
      const n=pname(d),r=provData[n];const box=document.getElementById('argmap').getBoundingClientRect();
      if(!r){tip.style.opacity=0;return;}
      d3.select(this).attr('stroke-width',1.4).attr('stroke','#185FA5');
      tip.innerHTML='<div style="padding:11px 13px;"><div style="font-weight:500;color:var(--text-primary);margin-bottom:6px;font-size:13px;">'+n+'</div>'+
        row('Inversión aprob.',fmt(r.inv),true)+row('Aprobados',r.ap)+row('En evaluación',r.ev)+row('Empleos prometidos',r.jobs.toLocaleString('es-AR'),true)+
        '<div style="margin-top:7px;color:var(--text-accent);font-size:11px;">Clic para hacer zoom y ver proyectos</div></div>';
      let x=ev.clientX-box.left+14,y=ev.clientY-box.top+14; if(x>box.width-250)x=ev.clientX-box.left-258;
      tip.style.left=x+'px';tip.style.top=y+'px';tip.style.opacity=1;
    })
    .on('mouseleave',function(){if(!zoomed){d3.select(this).attr('stroke-width',0.6).attr('stroke','#fff');}tip.style.opacity=0;})
    .on('click',function(ev,d){const n=pname(d);if(provData[n])zoomTo(d,n);});

  const markerG=g.append('g');

  function zoomTo(d,n){
    zoomed=true; tip.style.opacity=0;
    const b=path.bounds(d), dx=b[1][0]-b[0][0], dy=b[1][1]-b[0][1], cx=(b[0][0]+b[1][0])/2, cy=(b[0][1]+b[1][1])/2;
    const scale=Math.min(7,0.82/Math.max(dx/W,dy/H)), tx=W/2-scale*cx, ty=H/2-scale*cy;
    g.transition().duration(650).attr('transform','translate('+tx+','+ty+') scale('+scale+')');
    provPaths.transition().duration(650).style('opacity',pd=>pname(pd)===n?1:0.1).attr('stroke-width',0.6/scale);
    markerG.selectAll('*').remove();
    setTimeout(()=>{
      const ps=projects.filter(p=>p.p===n);
      const r=6.5/scale, sw=1.5/scale;
      const mk=markerG.selectAll('g.mk').data(ps).join('g').attr('class','mk')
        .attr('transform',p=>{const c=projection([p.ll[1],p.ll[0]]);return 'translate('+c[0]+','+c[1]+')';})
        .style('cursor','pointer');
      mk.append('circle').attr('r',r).attr('fill',p=>p.st==='aprobado'?'#1D9E75':'#EF9F27').attr('stroke','#fff').attr('stroke-width',sw);
      mk.append('circle').attr('r',r*0.34).attr('fill','#fff');
      mk.on('mousemove',function(ev,p){
        const box=document.getElementById('argmap').getBoundingClientRect();
        const aq=p.approx?'<i class="ti ti-map-pin-question" style="font-size:12px;vertical-align:-2px;color:var(--text-muted);"></i> ':'';
        tip.innerHTML='<div style="padding:12px 14px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><i class="ti '+(sIcon[p.s]||'ti-map-pin')+'" style="font-size:22px;color:var(--text-accent);"></i><div style="font-size:13px;font-weight:500;color:var(--text-primary);line-height:1.2;">'+p.n+'</div></div>'+
          row('Localidad',p.loc)+row('Sector',sName[p.s])+row('Inversión',fmt(p.inv))+row('Empleos',p.j)+row('Estado',p.st)+
          '<div style="margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border);font-size:11px;color:var(--text-secondary);line-height:1.5;">'+aq+p.d+'</div></div>';
        let x=ev.clientX-box.left+14,y=ev.clientY-box.top+14; if(x>box.width-250)x=ev.clientX-box.left-258; if(y>box.height-190)y=Math.max(6,ev.clientY-box.top-190);
        tip.style.left=x+'px';tip.style.top=y+'px';tip.style.opacity=1;
      }).on('mouseleave',()=>tip.style.opacity=0);
      mk.attr('opacity',0).transition().duration(320).attr('opacity',1);
    },660);
    back.style.display='flex'; hint.textContent=n+' · pasá el cursor por cada proyecto';
  }

  back.addEventListener('click',function(){
    zoomed=false; tip.style.opacity=0;
    g.transition().duration(600).attr('transform','translate(0,0) scale(1)');
    provPaths.transition().duration(600).style('opacity',1).attr('stroke-width',0.6).attr('stroke','#fff');
    markerG.selectAll('*').remove();
    back.style.display='none'; hint.textContent='Clic en una provincia para hacer zoom';
  });
});
})();
</script>
</body>
</html>
